<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KL Property Auction - Teacher Control Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0f172a 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { 
            text-align: center; 
            padding: 30px 0; 
            border-bottom: 2px solid rgba(249, 115, 22, 0.5); 
            margin-bottom: 40px;
        }
        .header h1 { 
            font-size: 2.2rem; 
            background: linear-gradient(90deg, #f97316 0%, #dc2626 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            margin-bottom: 8px;
        }
        .header p { color: #fbbf24; font-size: 1rem; }
        .controls-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
            margin-bottom: 40px; 
        }
        .control-card { 
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.4), rgba(30, 99, 145, 0.4)); 
            border: 2px solid rgba(249, 115, 22, 0.3); 
            border-radius: 15px; 
            padding: 20px;
        }
        .control-card h3 { 
            font-size: 1.2rem; 
            margin-bottom: 12px; 
            color: #f97316;
        }
        .property-selector label { 
            display: block; 
            color: #93c5fd; 
            margin-bottom: 8px; 
            font-weight: 600; 
        }
        .property-selector select { 
            width: 100%; 
            padding: 10px; 
            background: rgba(30, 58, 138, 0.5); 
            border: 1px solid rgba(249, 115, 22, 0.5); 
            border-radius: 8px; 
            color: white; 
            font-size: 1rem;
        }
        button { 
            padding: 10px 18px; 
            background: linear-gradient(90deg, #f97316 0%, #dc2626 100%); 
            border: none; 
            border-radius: 8px; 
            color: white; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.25s; 
            margin: 6px 6px 0 0;
        }
        button:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 0 20px rgba(249, 115, 22, 0.4); 
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-success { background: linear-gradient(90deg, #10b981 0%, #059669 100%); }
        .btn-start { background: linear-gradient(90deg, #22c55e 0%, #16a34a 100%); font-size: 1.1rem; padding: 14px 24px; }
        .btn-release { background: linear-gradient(90deg, #06b6d4 0%, #0891b2 100%); }
        .btn-auto { background: linear-gradient(90deg, #8b5cf6 0%, #7c3aed 100%); }
        .status-display { 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid rgba(249, 115, 22, 0.3); 
            border-radius: 10px; 
            padding: 16px; 
            margin-bottom: 12px;
        }
        .status-row { 
            display: flex; 
            justify-content: space-between; 
            padding: 8px 0; 
            border-bottom: 1px solid rgba(249, 115, 22, 0.12);
        }
        .status-label { color: #93c5fd; font-weight: 600; }
        .status-value { color: #fbbf24; font-weight: bold; }
        .properties-list { 
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.4), rgba(30, 99, 145, 0.4)); 
            border: 2px solid rgba(249, 115, 22, 0.3); 
            border-radius: 15px; 
            padding: 20px; 
        }
        .property-row { 
            display: grid; 
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr; 
            gap: 12px; 
            padding: 12px; 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid rgba(249, 115, 22, 0.08); 
            border-radius: 8px; 
            margin-bottom: 10px; 
            align-items: center;
        }
        .property-name { font-weight: 600; color: #a5f3fc; }
        .property-status { 
            padding: 6px 10px; 
            border-radius: 6px; 
            text-align: center; 
            font-weight: 600;
        }
        .status-open { background: rgba(34, 197, 94, 0.18); color: #86efac; }
        .status-sold { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
        .hidden { display: none; }
        .message { 
            padding: 12px; 
            background: rgba(34, 197, 94, 0.12); 
            border: 1px solid rgba(34, 197, 94, 0.2); 
            border-radius: 8px; 
            color: #86efac; 
            text-align: center; 
            font-weight: 600; 
            margin-bottom: 10px;
        }
        .error-message { 
            background: rgba(239, 68, 68, 0.12); 
            border: 1px solid rgba(239, 68, 68, 0.2); 
            color: #fca5a5; 
        }
        .auto-mode-indicator {
            padding: 8px 12px;
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 6px;
            color: #c4b5fd;
            font-weight: 600;
            display: inline-block;
            margin-top: 8px;
        }
        .silent-countdown-indicator {
            padding: 8px 12px;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.4);
            border-radius: 6px;
            color: #86efac;
            font-weight: 600;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔨 拍卖会控制面板</h1>
            <p>⚙️ 教师控制：按 START 开启竞标 + 自动倒数</p>
        </div>

        <div id="messageBox" class="hidden"></div>

        <div class="controls-grid">
            <div class="control-card">
                <h3>📍 当前房产</h3>
                <div class="property-selector">
                    <label>选择房产:</label>
                    <select id="propertySelect" onchange="switchProperty()">
                        <option value="1">房产 1 - Taman Puteri Subang 🏠</option>
                        <option value="2">房产 2 - Setia Alam 🏡</option>
                        <option value="3">房产 3 - Taman TTDI Shah Alam 🏰</option>
                        <option value="4">房产 4 - Bandar Mahkota Cheras 🏘️</option>
                        <option value="5">房产 5 - Taman Subang Murni 🌳</option>
                    </select>
                </div>

                <div class="status-display">
                    <div class="status-row">
                        <span class="status-label">状态:</span>
                        <span class="status-value" id="currentStatus">加载中...</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">竞标状态:</span>
                        <span class="status-value" id="biddingStatus">未开始</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">当前出价:</span>
                        <span class="status-value" id="currentBid">-</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">最高竞价者:</span>
                        <span class="status-value" id="currentBidder">-</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">Calling 阶段:</span>
                        <span class="status-value" id="currentStage">-</span>
                    </div>
                </div>

                <button id="startBiddingBtn" class="btn-start" onclick="startBidding()">🟢 START 竞标</button>
                <div id="silentCountdownIndicator" class="silent-countdown-indicator hidden">
                    ⏱️ 静默倒数: <span id="silentCountdownDisplay">10</span> 秒
                </div>

                <button class="btn-success" onclick="resetCurrentProperty()">🔄 重置本房产</button>
                <button onclick="markSoldOnly()">🏷️ 標為成交</button>
            </div>

            <div class="control-card">
                <h3>⚡ 手動操作</h3>
                <button onclick="startCalling()">🔨 開始 Calling (1st)</button>
                <button onclick="secondCalling()">🔨 進入 2nd Calling</button>
                <button onclick="thirdCalling()">🔨 進入 3rd Calling</button>
                <button onclick="forceSold()">✓ 強制成交</button>
                <button class="btn-release" onclick="openNextProperty()">➡️ 手動打開下一件</button>
            </div>

            <div class="control-card">
                <h3>🤖 完整自動模式</h3>
                <button class="btn-auto" onclick="startFullAutoMode()">▶️ 完整自動 (START → 靜默 → 1st → 2nd → 3rd → Sold)</button>
                <button onclick="stopAutoMode()">⏹️ 停止自動模式</button>
                <div id="autoModeStatus" class="hidden auto-mode-indicator">
                    🟢 自動模式運行中...
                </div>
                <p style="color:#93c5fd;font-size:0.85rem;margin-top:8px;">
                    靜默10秒 → 1st:10秒 → 2nd:10秒 → 3rd:5秒 → 自動成交
                </p>
            </div>

            <div class="control-card">
                <h3>📊 统计信息</h3>
                <div class="status-display">
                    <div class="status-row">
                        <span class="status-label">竞价者数:</span>
                        <span class="status-value" id="bidderCount">0</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">竞价次数:</span>
                        <span class="status-value" id="bidCount">0</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">已成交房产:</span>
                        <span class="status-value" id="soldCount">0/5</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="properties-list">
            <h2>📋 所有房产总览</h2>
            <div id="propertiesList" style="text-align: center; color: #93c5fd;">加载中...</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ubxfggqfnhvqyatgiolx.supabase.co';
        const SUPABASE_SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVieGZnZ3Fmbmh2cXlhdGdpb2x4Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2NzkzMzc0MSwiZXhwIjoyMDgzNTA5NzQxfQ.EWmE8zCzdIUln73QZeZVppGgLqUvPMiGyWI3yN0jI0M';

        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_SERVICE_KEY);

        let selectedProperty = 1;
        let allProperties = {};
        let autoModeInterval = null;

        // ✅ 更新为5个房产的起拍价
        const openingBids = {
            1: 450000,  // Taman Puteri Subang
            2: 550000,  // Setia Alam
            3: 688500,  // Taman TTDI Shah Alam
            4: 486000,  // Bandar Mahkota Cheras
            5: 445000   // Taman Subang Murni
        };

        // ✅ 房产名称映射
        const propertyNames = {
            1: 'Taman Puteri Subang 🏠',
            2: 'Setia Alam 🏡',
            3: 'Taman TTDI Shah Alam 🏰',
            4: 'Bandar Mahkota Cheras 🏘️',
            5: 'Taman Subang Murni 🌳'
        };

        async function loadData() {
            try {
                const { data, error } = await sb.from('properties').select('*').order('id');
                if (error) {
                    showMessage('❌ 加载失败: ' + error.message, true);
                    return;
                }
                if (data && data.length > 0) {
                    allProperties = {};
                    data.forEach(p => allProperties[p.id] = p);
                    if (!allProperties[selectedProperty]) {
                        const ids = Object.keys(allProperties).map(x=>parseInt(x,10)).sort((a,b)=>a-b);
                        selectedProperty = ids.length ? ids[0] : selectedProperty;
                    }
                    updateDisplay();
                }
            } catch (err) {
                console.error('加载错误:', err);
                showMessage('❌ 连接失败: ' + (err.message || err), true);
            }
        }

        function switchProperty() {
            selectedProperty = parseInt(document.getElementById('propertySelect').value);
            updateDisplay();
        }

        async function resetCurrentProperty() {
            if (!confirm('确定要重置房产 ' + selectedProperty + ' 吗？所有竞价记录将被清空！')) return;
            try {
                const openingBid = openingBids[selectedProperty];
                
                const { error: deleteError } = await sb.from('bidders').delete().eq('property_id', selectedProperty);
                if (deleteError) {
                    console.error('删除竞价记录错误:', deleteError);
                    showMessage('❌ 删除竞价记录失败: ' + deleteError.message, true);
                    return;
                }

                const { error: updateError } = await sb.from('properties').update({
                    current_price: openingBid,
                    highest_bidder: null,
                    stage: 0,
                    timer: 0,
                    status: 'open',
                    bidding_started: false,
                    silent_countdown: 0,
                    release_next: false,
                    release_by: null,
                    release_at: null,
                    sold_at: null,
                    opened_by_teacher: false
                }).eq('id', selectedProperty);

                if (updateError) {
                    console.error('更新房产错误:', updateError);
                    showMessage('❌ 更新房产失败: ' + updateError.message, true);
                    return;
                }

                showMessage('✓ 房产已重置！');
                await loadData();
            } catch (err) {
                console.error('重置错误:', err);
                showMessage('❌ 重置失败: ' + err.message, true);
            }
        }

        async function startBidding() {
            try {
                await sb.from('properties').update({ 
                    bidding_started: true,
                    silent_countdown: 10
                }).eq('id', selectedProperty);
                
                showMessage('✓ 竞标已开始！静默倒数 10 秒...');
                await loadData();
            } catch (err) {
                console.error('开始竞标错误:', err);
                showMessage('❌ 失败: ' + err.message, true);
            }
        }

        async function markSoldOnly() {
            try {
                const now = new Date().toISOString();
                await sb.from('properties').update({ status: 'sold', stage: 0, timer: 0, release_next: false, sold_at: now }).eq('id', selectedProperty);
                showMessage('✓ 已將當前房產標為 sold');
                await loadData();
            } catch (err) {
                console.error('標為 sold 錯誤:', err);
                showMessage('❌ 失敗: ' + err.message, true);
            }
        }

        async function startCalling() {
            try {
                await sb.from('properties').update({ stage: 1, timer: 10, bidding_started: true }).eq('id', selectedProperty);
                showMessage('✓ 開始 1st Calling');
                await loadData();
            } catch (err) { showMessage('❌ 失敗: ' + err.message, true); }
        }

        async function secondCalling() {
            try {
                await sb.from('properties').update({ stage: 2, timer: 10 }).eq('id', selectedProperty);
                showMessage('✓ 進入 2nd Calling'); 
                await loadData();
            } catch (err) { showMessage('❌ 失敗: ' + err.message, true); }
        }

        async function thirdCalling() {
            try {
                await sb.from('properties').update({ stage: 3, timer: 5 }).eq('id', selectedProperty);
                showMessage('✓ 進入 3rd Calling'); 
                await loadData();
            } catch (err) { showMessage('❌ 失敗: ' + err.message, true); }
        }

        async function forceSold() {
            try {
                const now = new Date().toISOString();
                await sb.from('properties').update({ status: 'sold', stage: 0, timer: 0, release_next: false, sold_at: now }).eq('id', selectedProperty);
                showMessage('✓ 已強制成交');
                await loadData();
            } catch (err) { console.error(err); showMessage('❌ 失敗: ' + err.message, true); }
        }

        async function openNextProperty() {
            try {
                const nextId = selectedProperty + 1;
                if (!allProperties[nextId]) {
                    showMessage('❌ 沒有下一件房産', true);
                    return;
                }
                
                await sb.from('properties').update({ opened_by_teacher: false }).neq('id', nextId);
                await sb.from('properties').update({
                    status: 'open',
                    stage: 0,
                    timer: 0,
                    bidding_started: false,
                    silent_countdown: 0,
                    opened_by_teacher: true,
                    opened_by_teacher_at: new Date().toISOString()
                }).eq('id', nextId);

                setTimeout(async () => {
                    try { await sb.from('properties').update({ opened_by_teacher: false }).eq('id', nextId); } 
                    catch(e){ console.error('cleanup opened_by_teacher failed', e); }
                }, 1500);

                showMessage(`✓ 已打開房産 ${nextId}`);
                selectedProperty = nextId;
                document.getElementById('propertySelect').value = String(nextId);
                await loadData();
            } catch (err) { 
                console.error(err); 
                showMessage('❌ 失敗: ' + err.message, true); 
            }
        }

        async function startFullAutoMode() {
            const prop = allProperties[selectedProperty];
            if (!prop) return;

            if (prop.status === 'sold') {
                showMessage('❌ 此房産已成交，無法啟動自動模式', true);
                return;
            }

            stopAutoMode();
            
            document.getElementById('autoModeStatus').classList.remove('hidden');
            showMessage('✓ 完整自動模式已啟動');

            await sb.from('properties').update({ 
                bidding_started: true,
                silent_countdown: 10
            }).eq('id', selectedProperty);
            await loadData();

            autoModeInterval = setInterval(async () => {
                try {
                    const { data } = await sb.from('properties').select('*').eq('id', selectedProperty).single();
                    if (!data) return;

                    if (data.status === 'sold') {
                        stopAutoMode();
                        return;
                    }

                    if (data.silent_countdown > 0) {
                        await sb.from('properties').update({ 
                            silent_countdown: data.silent_countdown - 1 
                        }).eq('id', selectedProperty);
                        
                        if (data.silent_countdown - 1 === 0) {
                            await sb.from('properties').update({ 
                                stage: 1, 
                                timer: 10 
                            }).eq('id', selectedProperty);
                            showMessage('⏩ 靜默倒數結束，進入 1st Calling');
                        }
                    }
                    else if (data.stage > 0) {
                        if (data.timer > 0) {
                            await sb.from('properties').update({ timer: data.timer - 1 }).eq('id', selectedProperty);
                        } else {
                            if (data.stage === 1) {
                                await sb.from('properties').update({ stage: 2, timer: 10 }).eq('id', selectedProperty);
                                showMessage('⏩ 自動進入 2nd Calling');
                            } else if (data.stage === 2) {
                                await sb.from('properties').update({ stage: 3, timer: 5 }).eq('id', selectedProperty);
                                showMessage('⏩ 自動進入 3rd Calling');
                            } else if (data.stage === 3) {
                                const now = new Date().toISOString();
                                await sb.from('properties').update({ 
                                    status: 'sold', 
                                    stage: 0, 
                                    timer: 0, 
                                    sold_at: now 
                                }).eq('id', selectedProperty);
                                showMessage('🎉 自動成交！');
                                stopAutoMode();
                            }
                        }
                    }

                    await loadData();
                } catch (err) {
                    console.error('自動模式錯誤:', err);
                }
            }, 1000);
        }

        function stopAutoMode() {
            if (autoModeInterval) {
                clearInterval(autoModeInterval);
                autoModeInterval = null;
            }
            document.getElementById('autoModeStatus').classList.add('hidden');
        }

        function updateDisplay() {
            const prop = allProperties[selectedProperty];
            if (!prop) return;

            document.getElementById('propertySelect').value = String(selectedProperty);
            document.getElementById('currentStatus').textContent = prop.status === 'open' ? '進行中' : '已成交';
            
            const biddingStatusEl = document.getElementById('biddingStatus');
            const startBtn = document.getElementById('startBiddingBtn');
            const silentIndicator = document.getElementById('silentCountdownIndicator');
            const silentDisplay = document.getElementById('silentCountdownDisplay');
            
            if (prop.status === 'sold') {
                biddingStatusEl.textContent = '已結束';
                startBtn.disabled = true;
                silentIndicator.classList.add('hidden');
            } else if (prop.bidding_started) {
                biddingStatusEl.textContent = '✅ 已開始';
                biddingStatusEl.style.color = '#86efac';
                startBtn.disabled = true;
                
                if (prop.silent_countdown > 0) {
                    silentIndicator.classList.remove('hidden');
                    silentDisplay.textContent = prop.silent_countdown;
                } else {
                    silentIndicator.classList.add('hidden');
                }
            } else {
                biddingStatusEl.textContent = '⏳ 未開始';
                biddingStatusEl.style.color = '#fbbf24';
                startBtn.disabled = false;
                silentIndicator.classList.add('hidden');
            }

            document.getElementById('currentBid').textContent = `RM ${Number(prop.current_price || 0).toLocaleString()}`;
            document.getElementById('currentBidder').textContent = prop.highest_bidder || '等待中...';
            document.getElementById('currentStage').textContent = prop.stage === 0 ? '未開始' : `${prop.stage} (${prop.timer}s)`;

            renderAllProperties();
            loadBidderStats();
        }

        async function loadBidderStats() {
            try {
                const { data: bidders } = await sb.from('bidders').select('*').eq('property_id', selectedProperty);
                if (bidders) {
                    const unique = new Set(bidders.map(b => b.bidder_name)).size;
                    document.getElementById('bidderCount').textContent = unique;
                    document.getElementById('bidCount').textContent = bidders.length;
                }
                const { data: allProps } = await sb.from('properties').select('*');
                const soldCount = (allProps || []).filter(p => p.status === 'sold').length;
                document.getElementById('soldCount').textContent = `${soldCount}/5`;
            } catch (err) { console.error('統計錯誤:', err); }
        }

        function renderAllProperties() {
            const list = document.getElementById('propertiesList');
            if (!allProperties || Object.keys(allProperties).length === 0) { 
                list.innerHTML = '<div style="color: #fca5a5;">❌ 没有房产数据</div>'; 
                return; 
            }

            list.innerHTML = Object.entries(allProperties)
                .sort((a,b)=> parseInt(a[0]) - parseInt(b[0]))
                .map(([id, prop]) => `
                <div class="property-row">
                    <div class="property-name">房产 ${id} - ${propertyNames[id] || ''} ${prop.bidding_started ? '✅' : '⏳'}</div>
                    <div>RM ${Number(prop.current_price || 0).toLocaleString()}</div>
                    <div style="color:#a5f3fc;">${prop.highest_bidder || '等待中...'}</div>
                    <div class="property-status ${prop.status === 'open' ? 'status-open' : 'status-sold'}">
                        ${prop.status === 'open' ? '進行中' : '已成交'}
                    </div>
                    <div>${prop.silent_countdown > 0 ? `靜默${prop.silent_countdown}s` : prop.stage > 0 ? `${prop.stage}階段 (${prop.timer}s)` : '-'}</div>
                </div>
            `).join('');
        }

        function showMessage(text, isError=false) {
            const box = document.getElementById('messageBox');
            box.innerHTML = text;
            box.classList.remove('hidden');
            box.classList.toggle('error-message', isError);
            setTimeout(()=>box.classList.add('hidden'), 3500);
        }

        loadData();
        setInterval(loadData, 1000);

        sb.channel('properties-changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'properties' }, () => loadData())
            .subscribe();
    </script>
</body>
